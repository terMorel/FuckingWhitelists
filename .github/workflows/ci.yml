name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate recovery shell scripts
        run: >-
          bash -n
          deploy/recovery-common.sh
          deploy/recovery-inventory.sh
          deploy/create-recovery-bundle.sh
          deploy/verify-recovery-bundle.sh
          deploy/stage-recovery-bundle.sh
          deploy/restore-new-server.sh
      - name: Install project and test tools
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest
      - name: Run lint
        run: ruff check .
