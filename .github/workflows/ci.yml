name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: panel/pyproject.toml
      - name: Validate recovery shell scripts
        run: >-
          bash -n
          panel/deploy/recovery-common.sh
          panel/deploy/recovery-inventory.sh
          panel/deploy/create-recovery-bundle.sh
          panel/deploy/verify-recovery-bundle.sh
          panel/deploy/stage-recovery-bundle.sh
          panel/deploy/restore-new-server.sh
      - name: Install project and test tools
        run: python -m pip install -e './panel[test]'
      - name: Run tests
        run: pytest panel/tests
      - name: Run lint
        run: ruff check panel
